  <rect x="380" y="310" width="90" height="6" fill="#d2d6c6"/><rect x="380" y="322" width="60" height="6" fill="#d2d6c6"/>
  <rect x="320" y="346" width="160" height="62" fill="#f8f9f3" stroke="#99a089"/>
