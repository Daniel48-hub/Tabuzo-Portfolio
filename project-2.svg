<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Phone showing a map with a pin and lost and found item cards" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d2d6c6" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#e2e5d8"/>
